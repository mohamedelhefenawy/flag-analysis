version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "127.0.0.1:3127:3000"

    environment:
      NODE_ENV: production
    restart: unless-stopped

    # NOTE: Do NOT mount over /app/public - it hides built-in images (scout/, home/, player/, etc.)
    # For user uploads, use a subpath: nextjs_public:/app/public/uploads

    networks:
      - frontend_net

networks:
  frontend_net:
    external: true

